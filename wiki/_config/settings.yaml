# Curio Wiki Configuration

auto_commit: true

# ── Self-Healing ──────────────────────────────────────────────────────────────
# Controls curio doctor and curio heal behaviour.
# These values are read directly from this file at runtime.
heal:
  # Proposals with confidence >= this threshold are auto-published and mirrored
  # to wiki/review/auto-approved/.  Proposals below it go to wiki/review/ for
  # human review.  Range: 0.0–1.0.  Default: 0.85.
  confidence_threshold: 0.85

  # Whether to add a visual info callout to auto-healed pages in Confluence.
  show_auto_heal_callout: true

  # Confluence label applied to every auto-healed published page.
  auto_heal_label: "curio:auto-healed"

  # Maximum pages processed per curio heal run (cost control).
  max_pages_per_run: 20

  # Half-life in days for freshness scoring. Pages older than this are at ~50%
  # freshness. Increase for stable KBs; decrease for fast-moving teams.
  stale_threshold_days: 240

  # Jaccard similarity above which two pages are flagged as overlapping.
  # Range: 0.0–1.0. Raise to 0.80 if your KB has legitimately overlapping content.
  overlap_threshold: 0.60

  # Allow curio heal to perform web search and external Confluence lookups.
  external_search_enabled: true

  # Minimum words in a branch index.md before it's flagged as thin.
  min_body_words: 50
