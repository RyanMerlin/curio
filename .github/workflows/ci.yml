name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: curio-rs

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: curio-rs
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: curio-rs

  test:
    name: cargo nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.86.5
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: curio-rs
      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@curio.local"
          git config --global user.name "Curio CI"
      - run: cargo nextest run --all-targets
        working-directory: curio-rs
      # nextest does not execute rustdoc tests; keep this explicit companion
      # gate without replacing nextest as the main test runner.
      - name: Run doctests
        run: cargo test --doc --all-features --locked
        working-directory: curio-rs
      - name: Run retrieval evaluation baseline
        run: cargo run --quiet --bin curio-retrieval-eval -- --corpus tests/fixtures/retrieval-eval/corpus.json --json | tee retrieval-baseline.json
        working-directory: curio-rs
      - name: Upload retrieval baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-baseline
          path: curio-rs/retrieval-baseline.json

  build:
    name: cargo build --release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: curio-rs
      - run: cargo build --release --bin curio --bin curio-service --bin curio-mcp
        working-directory: curio-rs

  msrv:
    name: Rust MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The MSRV is pinned via `toolchain:` below, not the action ref, so a
      # routine Dependabot bump of the action version can never silently
      # change which Rust version this job tests against (see #39/2026-07-20,
      # where `@1.88.0` -> `@1.100.0` broke this job because the ref doubled
      # as both the action version and the toolchain to install).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: curio-rs
      - run: cargo check --all-targets --locked
        working-directory: curio-rs

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-audit
      - run: cargo audit
        working-directory: curio-rs

  rustdoc:
    name: rustdoc warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
        working-directory: curio-rs
