name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: curio-rs

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: curio-rs
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: curio-rs

  test:
    name: cargo nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: curio-rs
      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@curio.local"
          git config --global user.name "Curio CI"
      - run: cargo nextest run --all-targets
        working-directory: curio-rs
      - name: Run retrieval evaluation baseline
        run: cargo run --quiet --bin curio-retrieval-eval -- --corpus tests/fixtures/retrieval-eval/corpus.json --json | tee retrieval-baseline.json
        working-directory: curio-rs
      - name: Upload retrieval baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-baseline
          path: curio-rs/retrieval-baseline.json

  build:
    name: cargo build --release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: curio-rs
      - run: cargo build --release --bin curio --bin curio-service --bin curio-mcp
        working-directory: curio-rs
