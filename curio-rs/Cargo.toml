[package]
name = "curio"
version = "1.0.0"
edition = "2024"
description = "Git-native editorial knowledge-base harness — turns raw sources into curated, hierarchically-placed knowledge with Confluence sync"
license = "Apache-2.0"
repository = "https://github.com/<your-org>/curio"
readme = "../README.md"
keywords = ["knowledge-base", "confluence", "agent", "curation", "editorial"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = "0.8"
serde_yaml = "0.9"
sha2 = "0.10"
scraper = "0.19"
walkdir = "2.5"
chrono = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pulldown-cmark = "0.13"
regex = "1.12.3"
zip = "0.6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tower-http = { version = "0.5", features = ["trace", "limit"] }
jsonwebtoken = "9"

[dev-dependencies]
tempfile = "3"
