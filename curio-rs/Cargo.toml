[package]
name = "curio"
version = "1.0.0"
edition = "2024"
description = "Git-native editorial knowledge-base harness — turns raw sources into curated, hierarchically-placed knowledge with Confluence sync"
license = "Apache-2.0"
repository = "https://github.com/<your-org>/curio"
readme = "../README.md"
keywords = ["knowledge-base", "confluence", "agent", "curation", "editorial"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1"
clap = { version = "4.6.1", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
dirs = "6.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = "0.8.9"
serde_yaml = "0.9"
sha2 = "0.11.0"
scraper = "0.27.0"
walkdir = "2.5"
chrono = "0.4.45"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pulldown-cmark = "0.13.4"
regex = "1.12.3"
zip = "8.6.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tower-http = { version = "0.7.0", features = ["trace", "limit"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
tempfile = "3"
