schema_version: 2
nodes:
  - title: Account-tree
    slug: account-tree
    icon: "1f3e2"
    description_markdown: |
      Customer- and account-specific intelligence, deliverables, and reusable account knowledge.
      Not a generic catch-all for any page that mentions an account.
      Metadata to track: source lineage, status, downstream references.
    children: []

  - title: Product-tree
    slug: product-tree
    icon: "1f4e6"
    description_markdown: |
      Product-centric guidance, playbooks, and reference content.
      Not temporary workspace for raw feature notes or launch scraps.
      Metadata to track: product owner, canonical source, related pages.
    children:
      - title: Example Server
        slug: example-server
        icon: "1f5a5"
        description_markdown: |
          Server-specific knowledge: upgrade guides, operational playbooks, and support escalation patterns.
        children:
          - title: API
            slug: api
            icon: "1f517"
            description_markdown: |
              REST API documentation, endpoint references, and integration examples for Example Server.
            children: []
          - title: MongoDB
            slug: mongodb
            icon: "1f4be"
            description_markdown: |
              MongoDB internal database operations, tooling, and troubleshooting for Example Server.
            children: []
          - title: Upgrade
            slug: upgrade
            icon: "1f504"
            description_markdown: |
              Upgrade guides, migration checklists, patch notes, and deployment procedures for Example Server.
            children: []
          - title: Authentication
            slug: authentication
            icon: "1f512"
            description_markdown: |
              Authentication configuration: SAML, Windows Auth, OAuth, Kerberos, and credential management.
            children: []
          - title: Administration
            slug: administration
            icon: "2699"
            description_markdown: |
              System administration, service management, configuration, and operational runbooks.
            children: []
          - title: SQL DB Persistence
            slug: sql-db-persistence
            icon: "1f5c4"
            description_markdown: |
              SQL Server and PostgreSQL persistence layer configuration, migration, and troubleshooting.
            children: []
          - title: High Availability
            slug: high-availability
            icon: "1f4aa"
            description_markdown: |
              High availability deployment patterns, worker node configuration, and failover procedures.
            children: []
          - title: User Management
            slug: user-management
            icon: "1f465"
            description_markdown: |
              User roles, permissions, analytic app access, and gallery management.
            children: []
      - title: Example Designer
        slug: example-designer
        icon: "270f"
        description_markdown: |
          Designer-specific guidance: workflow patterns, best practices, and troubleshooting.
        children: []
      - title: Intelligence Suite
        slug: intelligence-suite
        icon: "1f9e0"
        description_markdown: |
          AI/ML tooling guidance, AutoML patterns, and integration playbooks.
        children: []

  - title: Use-Case-tree
    slug: use-case-tree
    icon: "1f504"
    description_markdown: |
      Repeatable workflows, scenarios, and operating playbooks.
      Not a random bucket for one-off content.
      Metadata to track: trigger conditions, inputs, expected outputs.
    children: []

  - title: Topic-tree
    slug: topic-tree
    icon: "1f4da"
    description_markdown: |
      Subject matter pages when no stronger route applies.
      Not a dumping ground.
      Metadata to track: synonyms, related terms, canonical references.
    children: []

heal:
  confidence_threshold: 0.85
  show_auto_heal_callout: true
  auto_heal_label: "curio:auto-healed"
  max_pages_per_run: 20
  stale_threshold_days: 240
  overlap_threshold: 0.6
  external_search_enabled: true
  min_body_words: 50

slack:
  enabled: false
  workspace_id: null
  app_id: null
  admin_user_ids: []
  intake_channels: []
  notification_channels: []
  allowed_trigger_channels: []
  job_provider_default: "gemini"
  require_confirmation_for_actions: true

# ── Product registry (operator SSOT) ────────────────────────────────────────
# This block is the canonical source of truth for "what products does this
# deployment know about?" The Curio engine itself ships zero domain
# assumptions; everything below is illustrative for this demo workspace.
#
# Replace these example entries with your own products. Each entry drives:
#   - The routing pre-signal heuristic (reconcile.rs::heuristic_pre_signal)
#     — used as a HINT to the agent during process Phase 1
#   - The Confluence page icon for pages classified under this product
products:
  - slug: example-server
    title: "Example Server"
    emoji: "1f5a5"      # 🖥️
    title_signals:
      - "server"
      - "mongodb"
      - "host recovery"
      - "pre-upgrade"
    body_signals:
      - "server"
      - "mongodb"
      - "host recovery"
      - "pre-upgrade"
    body_signals_exclude_when: []

  - slug: example-designer
    title: "Example Designer"
    emoji: "1f3a8"      # 🎨
    title_signals:
      - "designer"
      - "canvas"
      - "tool palette"
    body_signals:
      - "designer"
      - "canvas"
      - "tool palette"
    # Designer's "workflow" body signal conflicts with server pages that
    # also use "workflow"; exclude when "server" is in the body too.
    body_signals_exclude_when:
      - "server"

  - slug: intelligence-suite
    title: "Intelligence Suite"
    emoji: "1f9e0"      # 🧠
    title_signals:
      - "intelligence suite"
      - "automl"
      - "machine learning"
      - "ai/ml"
    body_signals:
      - "intelligence suite"
      - "automl"
      - "machine learning"
      - "ai/ml"

# ── Operator icon overrides for harness-managed slugs ──────────────────────
# These override the built-in icons in sync.rs::page_icon_builtin. Set
# values here when you want a different glyph for the standard lanes.
# Leaving this section empty (or absent) uses the harness defaults.
category_icons: {}

# ── Related repositories (rendered on the Confluence admin page) ───────────
# Each entry becomes a link under "Source Repositories" on the harness's
# own admin overview page. Empty by default — Curio ships no hard-coded
# git hosts.
admin_related_repos: []
