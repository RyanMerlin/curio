connection:
  confluence_url: "${CURIO_CONFLUENCE_URL}"
  confluence_email: "${CURIO_CONFLUENCE_EMAIL}"

content_model:
  space_key: "${CURIO_SPACE_KEY}"

wiki:
  wiki_dir: "docs/wiki-demo"
  auto_commit: true
  sync:
    enabled: true
    # Demo harness wiki sync target. Production KBs should be set explicitly via --workspace or --kb-dir.
    confluence_parent_page_id: null
